# Chapter 1: Introduction

## 1.1 Project Overview & Motivation
In the contemporary era of digital health transformation, real-time remote physiological monitoring has emerged as a cornerstone for preemptive cardiovascular diagnostics and personalized healthcare. Cardiovascular diseases (CVDs) remain the leading cause of global mortality, accounting for an estimated 17.9 million deaths annually. A significant percentage of these fatalities are preventable if early pathological indicators—such as heart rate elevation, arterial oxygen saturation ($\text{SpO}_2$) degradation, and physical activity abnormalities—are detected in real-time. 

Traditional clinical monitoring solutions are predominantly centralized, requiring patients to be physically present in clinical facilities. This setup is not only resource-intensive but also fails to capture transient, intermittent anomalies (e.g., occasional cardiac arrhythmia or sudden hypoxic events) that occur during regular daily activities. While consumer-grade health wearables (smartwatches, fitness bands) have proliferated, they exhibit critical technical limitations:
1. **Raw Telemetry Overhead**: Constant transmission of high-frequency raw sensor readings (accelerometer, photoplethysmography waveforms) to the cloud rapidly depletes battery life and consumes excessive network bandwidth.
2. **Lack of Local Intelligence**: Many devices act as basic "data pipes" that rely entirely on internet connectivity to derive health metrics, rendering them ineffective in remote or low-connectivity zones.
3. **Proprietary and Opaque Algorithms**: The proprietary nature of commercial wearable software hinders medical customization, academic auditing, and clinical integration.

To address these challenges, this project presents the design and development of an intelligent, secure, and serverless **Hybrid Edge-Cloud IoT Health Monitoring System**. The system utilizes a dual-sensor wearable device built on the Espressif ESP32 microcontroller, interfacing with a MAX30102 PPG sensor and an MPU6050 Inertial Measurement Unit (IMU). By distributing processing between the edge (ESP32) and a serverless cloud infrastructure (Amazon Web Services), the proposed architecture achieves real-time, low-latency step counting and activity classification locally, while delegating heavy machine learning computations (biometric anomaly detection and heart disease risk prediction) to secure cloud functions.

---

## 1.2 Problem Statement
The integration of wearable biomedical sensors with Internet of Things (IoT) architectures presents several engineering challenges that must be addressed:

### 1.2.1 Limitations of Traditional Wearables
Traditional wearable systems operate under a centralized paradigm where raw sensor telemetry is continuously pushed to cloud databases. For high-frequency inertial data (typically sampled at 10Hz to 50Hz) and PPG waveforms, continuous transmission leads to high radio transceiver duty cycles. This results in thermal constraints, high battery drain, and network congestion. Furthermore, such systems exhibit high latency during critical events, as warning triggers must travel to the cloud, undergo database validation, and return to the client app.

### 1.2.2 The Need for Hybrid Edge-Cloud Processing
A hybrid paradigm is required to partition the workload:
1. **Edge Node**: The local microcontroller must process raw, high-frequency acceleration signals to count steps and recognize the user's current activity (Resting, Walking, Jogging) using resource-efficient heuristics. This reduces the cloud ingestion payload to a low-frequency summary transmitted every 5 seconds.
2. **Cloud Node**: The cloud backend must ingest this summary securely, extract biometric features (such as Heart Rate Variability via RMSSD), run unsupervised anomaly detection to identify statistical deviations from a baseline, and execute supervised ML ensembles on clinical survey inputs to assess overall cardiovascular risks.

The application must bridge this edge-cloud gap by providing a cross-platform mobile user interface that updates dynamically in real-time, offering instant medical warnings and personalized clinical feedback.

---

## 1.3 Objectives of the Project
The primary engineering objectives of this project are:
* **Hardware Co-Design**: Interface the classic ESP32 microcontroller with the MAX30102 pulse oximeter and the MPU6050 accelerometer/gyroscope over a shared Inter-Integrated Circuit ($\text{I}^2\text{C}$) serial bus, reassigning pins to GPIO 21 (SDA) and GPIO 22 (SCL) to ensure noise-free communication.
* **Edge Algorithm Development**: Implement a dynamic, hysteresis-based peak detection algorithm and sliding window feature extraction on the ESP32 to calculate step counts and classify movement activities locally without cloud dependency.
* **Local HTTP Server Design**: Develop a non-blocking web server on the ESP32 hosting an HTML/JS dashboard that shows live step metrics and activity labels over the local WiFi network.
* **Secure Cloud Integration**: Establish a secure MQTT over TLS ($x.509$ client certificate authenticated) telemetry stream to AWS IoT Core.
* **Serverless Cloud Analytics**: Design and deploy AWS Lambda functions in Python and Node.js to ingest IoT data, calculate heart rate variability (RMSSD), execute an Isolation Forest voting ensemble for biometric anomaly detection, and write summaries to Amazon DynamoDB.
* **Supervised Risk Prediction**: Implement a soft-voting machine learning ensemble combining Random Forest, Histogram-based Gradient Boosting, and Support Vector Machine (SVM) classifiers on AWS to predict heart disease risk from clinical data.
* **Cross-Platform Visualization**: Build a responsive Flutter mobile application that consumes the AWS API Gateway endpoints to display live sensor values, step counts, and cardiac risk predictions dynamically.

---

## 1.4 Scope and Significance
The scope of this project extends across the domains of embedded systems engineering, cloud computing, and applied machine learning. The significance of the system lies in its:
* **Resource Optimization**: Local edge processing reduces data transmission volume by over 90%, significantly extending the wearable's battery runtime.
* **Improved Anomaly Detection**: By comparing physical movement (from the IMU) with PPG biometric parameters, the system minimizes false-positive clinical alerts. For instance, high heart rate during jogging is classified as normal, whereas high heart rate while resting is flagged as an anomaly.
* **Low-Cost and Reusable Design**: Built using low-cost, off-the-shelf components, the system offers an affordable solution for rural telemedicine and home care monitoring.
* **Scalable Serverless Backend**: The AWS SAM-based cloud backend automatically scales with the number of deployed wearable devices, incurring zero idle-state costs.

# Chapter 2: Theoretical Background & Components

## 2.1 Overview of Internet of Things (IoT) in Healthcare
The paradigm of Internet of Things (IoT) in healthcare, often referred to as the Internet of Medical Things (IoMT), represents an interconnected infrastructure of medical devices, software applications, and health systems. The core architecture of IoMT systems is traditionally structured into three layers:
1. **Perception Layer (Sensor Node)**: Physical sensors in contact with the patient gather analog physiological data and convert it into digitized packets.
2. **Network Layer (Transmission Node)**: Secure communication channels (WiFi, Bluetooth Low Energy, cellular networks) route data from local nodes to intermediate gateways or remote cloud servers.
3. **Application Layer (Processing & Visualization Node)**: Cloud backends store, process, and analyze the telemetry, exposing visual summaries via mobile dashboards and alerting clinical stakeholders.

Applying IoMT to continuous cardiac care is of paramount significance. Traditional medical diagnostic tools, such as Holter monitors, provide retrospective analysis over a 24 to 48-hour window but are bulky and lack real-time warning capabilities. Modern IoMT architectures overcome these limitations, enabling continuous, non-invasive vital signs tracking during a patient's daily life.

---

### 2.2.2 MAX30102 Photoplethysmography (PPG) Sensor Working Principle
The MAX30102 is an integrated pulse oximetry and heart-rate monitor sensor module. It operates on the principle of **Photoplethysmography (PPG)**—the optical measurement of arterial volume changes during the cardiac cycle.

```
       MAX30102 Sensor Module
   +-------------------------------+
   |   [Red LED]       [IR LED]    |
   |     660nm          880nm      |
   |       |              |        |
   |       v              v        |
   |    ~~~~~~~~~~~~~~~(Skin)~~~~  |
   |       |              |        |
   |       +-----\  /-----+        |
   |              \/               |
   |        [Photodetector]        |
   |               |               |
   |               v               |
   |     [18-bit ADC Converter]    |
   |               |               |
   |               v               |
   |         I2C Registers         |
   +-------------------------------+
```

**Operating Physics:**
1. **Light Emission**: The sensor integrates two Light Emitting Diodes: a **Red LED** (660 nm wavelength) and an **Infrared (IR) LED** (880 nm wavelength).
2. **Light Absorption & Hemoglobin State**:
   * Oxygenated hemoglobin ($\text{HbO}_2$) absorbs more infrared light and allows red light to pass through.
   * Deoxygenated hemoglobin ($\text{Hb}$) absorbs more red light and allows infrared light to pass through.
3. **Photodetector**: A high-sensitivity photodiode measures the light intensity reflected or transmitted through the tissue. During the systole phase of the cardiac cycle, heart contraction pushes oxygenated blood to peripheral capillaries, increasing $\text{SpO}_2$ volume and light absorption (resulting in a photodetector intensity minimum). During diastole, capillary blood volume decreases, reducing light absorption (resulting in a photodetector intensity maximum).
4. **Digitization**: An internal 18-bit Analog-to-Digital Converter (ADC) digitizes the optical signals, transmitting the raw values via $\text{I}^2\text{C}$.
5. **Saturation Calculation ($\text{SpO}_2$)**: The oxygen saturation is computed using the "Ratio of Ratios" ($R$) formula:
   $$R = \frac{\left( \frac{AC_{\text{Red}}}{DC_{\text{Red}}} \right)}{\left( \frac{AC_{\text{IR}}}{DC_{\text{IR}}} \right)}$$
   $$\text{SpO}_2\% = A - B \cdot R$$
   where $AC$ represents the time-varying components (due to arterial pulses), $DC$ represents the constant baseline (due to bone, muscle, and venous blood), and $A, B$ are calibration constants empirically determined for the sensor.

### 2.2.3 MPU6050 Inertial Measurement Unit (IMU): Working Principle
The MPU6050 is a Micro-Electro-Mechanical Systems (MEMS) sensor combining a 3-axis accelerometer and a 3-axis gyroscope on a single silicon die.

* **Accelerometer Working Principle**: It measures linear acceleration along the X, Y, and Z axes. Internally, MEMS accelerometers consist of a movable "proof mass" suspended on silicon springs between fixed capacitive plates. When linear force is applied, the proof mass displaces, changing the differential capacitance. An internal circuit converts this change into voltage, which is digitized by a 16-bit ADC.
* **Gyroscope Working Principle**: It measures angular velocity (rotation rate) around the X, Y, and Z axes based on the **Coriolis Effect**. When the sensor rotates, a Coriolis force acts on an internally vibrating mass, inducing a mechanical displacement. The displacement alters capacitance, which is converted to a digital output.
* **Application in Step Counting**: In our system, the MPU6050 is polled at 10Hz. The 3D acceleration vector $\vec{a} = [a_x, a_y, a_z]$ is converted into gravity-compensated net magnitude:
   $$\text{Mag} = \sqrt{a_x^2 + a_y^2 + a_z^2} - 1.0g$$
   By tracking fluctuations in this magnitude over time, step peaks are detected dynamically.

### 2.2.4 Inter-Integrated Circuit ($\text{I}^2\text{C}$) Communication Protocol
$\text{I}^2\text{C}$ is a synchronous, multi-master, multi-slave, packet-switched, single-ended serial communication bus. 

```
               Pull-Up Resistors
               +3.3V  +3.3V
                 |      |
                 R      R
                 |      |
   +-------------v------v-------------+
   |             |      |             |
   |   SDA  -----+------+-------------+----> Serial Data (SDA)
   |   SCL  -----+------+-------------+----> Serial Clock (SCL)
   |             |      |             |
   +-------------+------+-------------+
                 |      |
         +-------v------+-------+
         |                      |
   +-----+------+         +-----+------+
   |   MAX30102 |         |   MPU6050  |
   |   (0x57)   |         |   (0x68)   |
   +------------+         +------------+
```

**Bus Architecture:**
* **SDA (Serial Data)**: Bidirectional line for data transfer.
* **SCL (Serial Clock)**: Unidirectional clock line driven by the master (ESP32).
* **Pull-Up Resistors**: Both lines require pull-up resistors (typically $4.7\text{ k}\Omega$ to $10\text{ k}\Omega$) connected to $V_{DD}$ to pull the lines high when inactive.
* **Addressing**: Each slave on the bus has a unique 7-bit address. The master initiates communication by sending a start condition, followed by the slave address and a Read/Write bit:
  * **MAX30102 Slave Address**: `0x57`
  * **MPU6050 Slave Address**: `0x68`
* **Classic ESP32 Pins**: In our hardware modification, SDA is mapped to Pin 21 and SCL is mapped to Pin 22.

## 2.3 Cloud Computing & Database Technologies

### 2.3.1 AWS IoT Core Message Broker & MQTT Protocol
AWS IoT Core is a managed cloud service that lets connected devices interact securely with cloud applications.
* **MQTT (Message Queuing Telemetry Transport)**: A lightweight pub-sub network protocol designed for low-bandwidth, high-latency, or unreliable networks.
* **QoS (Quality of Service) Levels**: We use **QoS 1** ("At least once delivery") to ensure critical step counts and anomaly events are successfully transmitted to the broker.
* **TLS Security**: AWS IoT Core enforces transport security. Connections must use **TLS v1.2** or v1.3 with client-side $x.509$ certificates and private keys generated by the AWS Certificate Manager (ACM). The ESP32 utilizes the `WiFiClientSecure` library to perform asymmetric cryptography and establish a secure socket connection.

### 2.3.2 AWS Lambda Serverless Computing
AWS Lambda is an event-driven, serverless computing platform.
* **Function-as-a-Service (FaaS)**: Code runs in micro-containers that initialize on demand (cold starts) and scale automatically to handle millions of requests without manual provisioning.
* **Execution Trigger**: The `IngestIoTData` Lambda is triggered by an AWS IoT Rule when a message is published to `health/+/raw`. It decodes the JSON payload, computes heart rate variability, runs the Isolation Forest model, and updates DynamoDB.

### 2.3.3 Amazon DynamoDB NoSQL Database
DynamoDB is a fully managed, multi-region NoSQL database that provides single-digit millisecond latency.
* **Data Partitioning**: The table `HealthTelemetrySummaries` is keyed on:
  * **Partition Key (PK)**: `deviceId` (String) — isolates telemetry records for each patient.
  * **Sort Key (SK)**: `timestamp` (String) — stores records chronologically, enabling time-series queries.
* **Schema-less Nature**: Supports varying document structures, which is ideal for storing raw readings, filtered biometrics, and activity classification strings in a single record.

## 2.4 Machine Learning Foundations

### 2.4.1 Unsupervised Anomaly Detection: Isolation Forest
The **Isolation Forest (iForest)** algorithm isolates anomalies instead of profiling normal data points. 

```
               Isolation Forest Partitioning
      Feature Y
        ^
        |   . . .   .
        |  .  *  . . .     <-- Normal points (high density,
        |   . . * . .          requires many splits to isolate)
        |  . . . . .
        |
        |        *         <-- Anomaly (isolated, requires
        |                          very few splits)
        +----------------------------------------> Feature X
```

**Mathematical Formulation:**
Given a training dataset $X = \{x_1, \dots, x_n\}$ of $n$ instances in a $d$-dimensional space, the algorithm recursively partitions the space by randomly selecting a feature and a split value between the minimum and maximum values of that feature. This recursive partitioning is represented as an Isolation Tree (iTree).

Anomalies are easier to isolate and therefore appear closer to the root of the tree. The anomaly score $s(x, n)$ of an instance $x$ is defined as:
$$s(x, n) = 2^{-\frac{\mathbb{E}(h(x))}{c(n)}}$$
where:
* $h(x)$ is the path length (number of edges from the root to the leaf node) of instance $x$ in an iTree.
* $\mathbb{E}(h(x))$ is the expected (average) path length of $x$ across a forest of iTrees.
* $c(n)$ is the average path length of an unsuccessful search in a Binary Search Tree (BST) built with $n$ nodes:
  $$c(n) = 2\ln(n - 1) + 0.5772156649 - \frac{2(n - 1)}{n}$$
  where $0.5772156649$ is Euler's constant.

**Decision Boundaries:**
* If $s(x, n) \to 1$: The expected path length $\mathbb{E}(h(x)) \to 0$. The instance is classified as an **anomaly**.
* If $s(x, n) < 0.5$: The expected path length is large. The instance is classified as **normal**.

### 2.4.2 Supervised Cardiac Risk Assessment Ensemble Models

#### 2.4.2.1 Random Forest Classifier
Random Forest is a bagging ensemble method that constructs multiple decision trees during training.
* **Bootstrap Aggregation (Bagging)**: Each tree is trained on a random bootstrap sample of the training data.
* **Feature Randomness**: At each node split, only a random subset of features is considered.
* **Decision Rule**: The final classification probability $P(Y = c \mid x)$ is the average of individual tree probabilities:
  $$P(Y = c \mid x) = \frac{1}{T} \sum_{t=1}^{T} P_t(Y = c \mid x)$$

#### 2.4.2.2 Histogram-based Gradient Boosting
This algorithm bins continuous features into integer bins (typically 256 bins), reducing the number of split points.
* **Complexity Reduction**: The tree construction complexity drops from $\mathcal{O}(n_{\text{samples}} \cdot n_{\text{features}})$ to $\mathcal{O}(n_{\text{bins}} \cdot n_{\text{features}})$.
* **Gradient Step**: At each iteration $m$, the model fits a new weak learner $h_m(x)$ to the negative gradients (pseudo-residuals) of the loss function:
  $$r_{im} = -\left[ \frac{\partial L(y_i, F(x_i))}{\partial F(x_i)} \right]_{F(x) = F_{m-1}(x)}$$
* **AWS Lambda Performance**: This implementation significantly reduces memory usage, making it ideal for AWS Lambda containers.

#### 2.4.2.3 Support Vector Classifier (SVC)
SVC finds the optimal separating hyperplane that maximizes the margin between classes.
* **Optimization Formulation**:
  $$\min_{w, b, \xi} \frac{1}{2} \|w\|^2 + C \sum_{i=1}^{n} \xi_i$$
  subject to:
  $$y_i (w^T \phi(x_i) + b) \ge 1 - \xi_i, \quad \xi_i \ge 0$$
  where $\xi_i$ are slack variables and $C$ controls the trade-off between margin width and classification errors.
* **Kernel Trick**: We use the Radial Basis Function (RBF) kernel to map inputs to a high-dimensional space:
  $$K(x_i, x_j) = \exp(-\gamma \|x_i - x_j\|^2)$$

## 2.5 Literature Survey & Research Gaps

To establish the academic context of our project, we reviewed five prominent publications in the field of IoT-based vital signs monitoring:

| Ref | Author & Year | Methodology / Stack | Core Findings | Limitations / Gaps |
| :--- | :--- | :--- | :--- | :--- |
| **[1]** | Selvam et al. (2025) | AD8232 ECG + ESP32 + Ubidots Cloud | Demonstrated real-time ECG waveform transmission to Ubidots for clinical alert generation. | Required heavy cloud resources; lacked local edge analytics; did not measure movement or SpO2. |
| **[2]** | Kumar et al. (2024) | MAX30100 + NodeMCU + DHT11 + Custom Web Server | Implemented AES-encryption at the microcontroller level before sending vitals to the cloud. | Lacked machine learning anomaly detection; DHT11 is not medical grade; limited scaling. |
| **[3]** | Zahhad et al. (2021) | Arduino + ESP8266 + Blynk Cloud | Developed a low-cost vital signs monitor (HR, SpO2, Temp) utilizing Blynk for user interface. | Relied entirely on third-party Blynk IoT templates; lacked custom state machine logic; no edge step detection. |
| **[4]** | Ananth et al. (2019) | Smartwatch + ThingSpeak + IFTTT | Used ThingSpeak channels to route patient alerts and trigger SMS notifications via IFTTT. | High latency in alert delivery (>10s); no support for batch data processing; lack of biometric feature extraction. |
| **[5]** | Wan et al. (2018) | Wearable IoT System (WISE) + Cloud Database | Proposed a wearable framework that operates independently without a smartphone. | High power consumption due to continuous cellular/WiFi radio activity; lacked local sensor comparisons. |

### Research Gaps Identified
Based on our literature survey, we identified several critical gaps in existing IoMT designs:
1. **Lack of Local Physical Context**: Most systems process vital signs (heart rate, oxygen levels) in isolation. Without physical activity context (e.g., whether the user is resting, walking, or jogging), systems generate excessive false alarms during normal exertion.
2. **High Bandwidth & Cost Overhead**: Continuous transmission of raw signals drains device battery and increases cloud costs.
3. **Absence of Serverless Custom AI Pipelines**: Existing research often uses simple threshold triggers or commercial IoT dashboards (Blynk, ThingSpeak), lacking secure, custom ML architectures for biometric anomaly detection.

Our project addresses these gaps by implementing a hybrid edge-cloud architecture that performs step counting and activity recognition locally on the ESP32 while routing secure data to custom serverless ML models in the cloud.

## 3.4 Edge-Side Data Processing Methodology

### 3.4.1 Gravity-Compensated Acceleration Magnitude
To detect steps and classify movement independently of the wearable's physical orientation, the raw three-dimensional linear acceleration vector $\vec{a}(t) = [a_x(t), a_y(t), a_z(t)]$ is projected into a one-dimensional scalar magnitude. This is achieved by computing the Euclidean norm of the vector and subtracting the constant gravitational acceleration ($1.0g$ in calibrated accelerometer units):
$$\text{Mag}(t) = \sqrt{a_x(t)^2 + a_y(t)^2 + a_z(t)^2} - 1.0g$$
Subtracting gravity isolates the dynamic acceleration components resulting from user movement.

### 3.4.2 Sliding Window & Peak-to-Peak Feature Extraction
To analyze movement patterns, a sliding window $W$ of size $N = 10$ is maintained, representing a 1-second duration at a 10 Hz sampling rate. At each time step $t$, the window contains the historical magnitude values:
$$W_t = \{\text{Mag}(t - N + 1), \dots, \text{Mag}(t)\}$$
The peak-to-peak magnitude range (fluctuation) is extracted across this window:
$$\text{Range}_t = \max_{x \in W_t} (x) - \min_{x \in W_t} (x)$$
This parameter serves as the primary metric for activity classification.

### 3.4.3 Peak-Detection and Hysteresis Step Count Algorithm
Steps are counted by identifying acceleration peaks. The algorithm employs a dynamic thresholding mechanism with hysteresis to filter out minor fluctuations:
1. **Peak Condition**: A step is registered at time $t$ if the magnitude peaks and exceeds a dynamic threshold $\theta_{\text{step}}$:
   $$\text{Mag}(t) > \text{Mag}(t-1) \quad \text{AND} \quad \text{Mag}(t) > \text{Mag}(t+1) \quad \text{AND} \quad \text{Mag}(t) > \theta_{\text{step}}$$
2. **Hysteresis Window**: To prevent double-counting steps due to sensor noise or high-frequency vibrations during a single stride, a lockout window of $300\text{ ms}$ is enforced:
   $$\Delta t_{\text{last\_step}} > 300\text{ ms}$$

### 3.4.4 Heuristic Edge Activity Classification
The movement state is classified on the edge using the computed magnitude range:
* **Resting**: $\text{Range}_t < 0.18g$. The user is stationary or sitting.
* **Walking**: $0.18g \le \text{Range}_t \le 0.60g$. Typical range during rhythmic walking.
* **Jogging**: $\text{Range}_t > 0.60g$. High-intensity linear movement.

## 3.5 Cloud-Side Data Ingestion & Analytics Pipeline

### 3.5.1 Biometric Feature Extraction & HRV Calculation (RMSSD)
Upon receiving the telemetry data, the cloud ingestion Lambda function extracts statistical features from the physiological signals. The primary index for cardiac health and autonomic nervous system regulation is **Heart Rate Variability (HRV)**, calculated using the **Root Mean Square of Successive Differences (RMSSD)** between adjacent heartbeat intervals:
$$\text{RMSSD} = \sqrt{\frac{1}{M - 1} \sum_{i=1}^{M-1} (RR_{i+1} - RR_i)^2}$$
where $RR_i$ is the $i$-th heartbeat interval (in milliseconds) derived from the PPG peaks. 

Additionally, the Lambda function calculates the skewness and kurtosis of the incoming signal buffer to assess signal quality and filter out artifacts:
$$\text{Skewness} = \frac{\frac{1}{k}\sum_{j=1}^k (x_j - \mu)^3}{\sigma^3}$$
$$\text{Kurtosis} = \frac{\frac{1}{k}\sum_{j=1}^k (x_j - \mu)^4}{\sigma^4}$$

### 3.5.2 Ensembled Anomaly Isolation Pipeline
To evaluate if incoming telemetry is anomalous, the cloud ingestion Lambda implements an unsupervised Isolation Forest voting ensemble. Features including average heart rate, $\text{SpO}_2$, temperature, and RMSSD HRV are evaluated. The model returns an anomaly score $s(x, n)$ for each record. If $s(x, n) \ge 0.55$, the record is flagged as anomalous.

To prevent false alarms when the user is not actively wearing the device, a bypass check is executed. If the MAX30102 sensor reports `fingerDetected: false`, the anomaly detection pipeline is bypassed. In this case, `isAnomaly` is set to `false`, vitals default to `0.0`, and the database summary reads: *"Wearable active. Place finger on sensor for vitals."*

### 3.5.3 Ensembled Cardiac Risk Inference Pipeline
For heart disease risk prediction from clinical survey inputs, the system uses a soft-voting ensemble classifier. The soft-voting mechanism averages the predicted class probabilities of three base models: Random Forest (RF), Histogram-based Gradient Boosting (HGB), and Support Vector Machine (SVC).

The ensembled probability $\hat{P}(Y = 1 \mid x)$ is computed as:
$$\hat{P}(Y = 1 \mid x) = w_{\text{RF}} P_{\text{RF}}(Y = 1 \mid x) + w_{\text{HGB}} P_{\text{HGB}}(Y = 1 \mid x) + w_{\text{SVC}} P_{\text{SVC}}(Y = 1 \mid x)$$
where:
* $P_m(Y = 1 \mid x)$ is the probability predicted by model $m$ that class $Y = 1$ (Heart Disease Present).
* $w_m$ represents the relative model weights ($\sum w_m = 1$). In this implementation, uniform weights are applied: $w_{\text{RF}} = w_{\text{HGB}} = w_{\text{SVC}} = \frac{1}{3}$.

# Chapter 4: Hardware & Firmware Implementation

## 4.1 System Circuit Connections and Wiring Schematics
To build the health monitoring wearable, the sensor modules must be interfaced with the central processing microcontroller. This design utilizes a **classic ESP32** developer board. Because both the MPU6050 (Inertial Measurement Unit) and the MAX30102 (Photoplethysmography sensor) communicate using the **Inter-Integrated Circuit ($\text{I}^2\text{C}$)** serial protocol, they can share the same hardware bus lines.

### Shared Bus Topography
The system establishes a single $\text{I}^2\text{C}$ bus. The ESP32 acts as the bus master, initiating all read/write cycles. The MPU6050 and MAX30102 act as slaves. Address collision is avoided because the devices have unique fixed hardware addresses:
*   **MAX30102**: Address `0x57`
*   **MPU6050**: Address `0x68`

---

## 4.2 Microcontroller Pinout Allocations
In this design, we override the ESP32's default $\text{I}^2\text{C}$ pins to utilize **GPIO 21 (SDA)** and **GPIO 22 (SCL)**. This ensures clean board layouts and compatibility with classic ESP32 developer modules.

### Pinout Mapping Tables

#### Table 4.1: MAX30102 Pulse Oximeter to ESP32 Pin Mapping
| MAX30102 Pin | Pin Description | ESP32 GPIO Pin | Connection Type |
| :--- | :--- | :--- | :--- |
| **VCC** | Power Supply Input | **3.3V** | Power |
| **GND** | Ground Reference | **GND** | Ground |
| **SDA** | I2C Serial Data Line | **GPIO 21** | Digital Bidirectional |
| **SCL** | I2C Serial Clock Line | **GPIO 22** | Digital Input (driven by Master) |
| **INT** | Interrupt Output (Active Low) | *Not Connected* | Bypassed (using software polling) |

#### Table 4.2: MPU6050 IMU to ESP32 Pin Mapping
| MPU6050 Pin | Pin Description | ESP32 GPIO Pin | Connection Type |
| :--- | :--- | :--- | :--- |
| **VCC** | Power Supply Input | **3.3V** | Power |
| **GND** | Ground Reference | **GND** | Ground |
| **SDA** | I2C Serial Data Line | **GPIO 21** | Digital Bidirectional |
| **SCL** | I2C Serial Clock Line | **GPIO 22** | Digital Input (driven by Master) |
| **AD0** | I2C Address Select LSB | **GND** (selects `0x68`) | Ground (Hardware address pin) |

#### Table 4.3: Piezoelectric Buzzer to ESP32 Pin Mapping
| Buzzer Pin | Pin Description | ESP32 GPIO Pin | Connection Type |
| :--- | :--- | :--- | :--- |
| **Positive (+)** | Anode Trigger Line | **GPIO 25** | Digital Output (PWM capable) |
| **Negative (-)** | Cathode Return Line | **GND** | Ground |

## 4.3 ESP32 Firmware Implementation Details
The firmware is written in C++ using the Arduino framework. The complete logic is defined in [Combined_MPU_MAX_Dashboard.ino](file:///d:/Anurag/b.tech/final_year_project/health_monitor_app/ESP_code/Combined_MPU_MAX_Dashboard/Combined_MPU_MAX_Dashboard.ino). Below are the core modules and their implementation details.

### 4.3.1 Sensor Drivers & Bus Management
The I2C bus is initialized during `setup()` with a clock speed of 100 kHz. The sensors are configured by writing directly to their control registers.
*   **MPU6050 configuration**: The accelerometer full-scale range is set to $\pm 2g$ to achieve maximum resolution for step counting.
*   **MAX30102 configuration**: Setup parameters configure LED pulse amplitude, sample rates, and sample averaging.

```cpp
void setup() {
  Serial.begin(115200);
  delay(1000);

  // Initialize I2C Bus with custom pins
  Wire.begin(SDA_PIN, SCL_PIN);
  Wire.setClock(100000); // 100 kHz standard clock speed

  initMPU6050();
  initMAX30102();
  ...
}

void initMAX30102() {
  if (!particleSensor.begin(Wire, I2C_SPEED_FAST)) {
    Serial.println("MAX30102 not found. Check wiring.");
    while (1);
  }
  // Setup: LED power = 60 (approx 12mA), sample avg = 4, mode = Multi-LED (2), 
  // sample rate = 400Hz, pulse width = 411us, ADC range = 4096
  particleSensor.setup(60, 4, 2, 400, 411, 4096);
  particleSensor.setPulseAmplitudeRed(0x1F); // Set red LED intensity
  particleSensor.setPulseAmplitudeIR(0x1F);  // Set IR LED intensity
  ...
}
```

### 4.3.2 Non-Blocking Data Polling & Buffer Logic
To ensure that high-frequency accelerometer processing (at 25 Hz) does not block or get interrupted by the slower PPG sensor reads, we use a non-blocking loop pattern. Instead of using `delay()`, the execution is controlled via timestamp checks against `millis()`.

Additionally, the inner loop of the MAX30102 polling checks if samples are available without pausing execution. While waiting for new PPG samples, it continues to call the accelerometer update function:

```cpp
// Collect 25 new samples for MAX30102 buffer update
fingerDetected = true;
for (byte i = 75; i < BUFFER_LENGTH; i++) {
  while (!particleSensor.available()) {
    particleSensor.check();
    // Keep sampling accelerometer at 25Hz while waiting for PPG sensor
    updateAccelerometerAndActivity(); 
    client.loop(); // Keep MQTT connection alive
  }

  long irValue  = particleSensor.getIR();
  long redValue = particleSensor.getRed();
  ...
}
```

### 4.3.3 Edge Step Count Implementation
The step counting algorithm measures the Euclidean magnitude of acceleration, pushes it to a circular buffer, and detects peaks that cross a dynamic threshold. A minimum lockout time (300 ms) prevents false triggers:

```cpp
// Step counting variables
float stepThreshold = 1.22;  // Peak threshold for a step in g
bool aboveThreshold = false;
unsigned long lastStepTime = 0;
const unsigned long minStepInterval = 300; // Hysteresis lockout in ms

void updateAccelerometerAndActivity() {
  static unsigned long lastMpuRead = 0;
  if (millis() - lastMpuRead >= 40) { // 25 Hz sampling rate (40ms interval)
    lastMpuRead = millis();
    readAndPrintMPU6050();

    // Calculate acceleration magnitude: Mag = sqrt(ax^2 + ay^2 + az^2)
    float mag = sqrt(g_ax * g_ax + g_ay * g_ay + g_az * g_az);

    // Store in circular magnitude buffer
    magBuffer[magIndex] = mag;
    magIndex = (magIndex + 1) % MAG_BUFFER_SIZE;
    if (magIndex == 0) {
      magBufferFull = true;
    }

    // Peak-detection step count logic with hysteresis
    if (mag > stepThreshold && !aboveThreshold) {
      if (millis() - lastStepTime > minStepInterval) {
        stepCount++;
        lastStepTime = millis();
        aboveThreshold = true;
      }
    } else if (mag < 1.08) {
      aboveThreshold = false;
    }
    
    // Update activity classification
    updateActivityState();
  }
}
```

### 4.3.4 Activity Recognition Heuristics Code
Activity recognition is processed on the edge by calculating the peak-to-peak amplitude range within the sliding window magnitude buffer. This range represents the intensity of the physical motion:

```cpp
float getMagnitudeRange() {
  float minM = 999.0;
  float maxM = -999.0;
  int count = magBufferFull ? MAG_BUFFER_SIZE : magIndex;
  if (count == 0) return 0.0;
  
  // Find min and max magnitude inside sliding window
  for (int i = 0; i < count; i++) {
    if (magBuffer[i] < minM) minM = magBuffer[i];
    if (magBuffer[i] > maxM) maxM = magBuffer[i];
  }
  return maxM - minM; // Fluctuation range
}

void updateActivityState() {
  float range = getMagnitudeRange();
  
  // Heuristic thresholds
  if (range < 0.18) {
    currentActivity = "Resting";
  } else if (range < 0.60) {
    currentActivity = "Walking";
  } else {
    currentActivity = "Jogging";
  }
}
```

### 4.3.5 Local HTTP Web Dashboard & JSON Endpoint
The ESP32 runs a local web server (on port 80). When a device on the same WiFi network accesses the ESP32's IP address, it serves an HTML page containing dashboard widgets. The webpage makes asynchronous AJAX calls to the `/data` endpoint every second to fetch the live metrics:

```cpp
WebServer server(80);

void setupWebEndpoints() {
  server.on("/",     handleRoot);
  server.on("/data", handleData);
  server.begin();
}

void handleRoot() {
  // Serves HTML string stored in PROGMEM (DASHBOARD_HTML)
  server.send(200, "text/html", DASHBOARD_HTML);
}

void handleData() {
  // Returns raw values and edge summaries in JSON format
  String json = "{";
  json += "\"ax\":"     + String(g_ax, 2) + ",";
  json += "\"ay\":"     + String(g_ay, 2) + ",";
  json += "\"az\":"     + String(g_az, 2) + ",";
  json += "\"gx\":"     + String(g_gx, 1) + ",";
  json += "\"gy\":"     + String(g_gy, 1) + ",";
  json += "\"gz\":"     + String(g_gz, 1) + ",";
  json += "\"temp\":"   + String(g_temp, 1) + ",";
  json += "\"beatAvg\":" + String(beatAvg) + ",";
  json += "\"spo2Avg\":" + String(spo2Avg) + ",";
  json += "\"finger\":"  + String(fingerDetected ? "true" : "false") + ",";
  json += "\"activityLabel\":\"" + currentActivity + "\",";
  json += "\"steps\":"   + String(stepCount);
  json += "}";
  server.send(200, "application/json", json);
}
```

### 4.3.6 Secure WiFi & SSL/TLS MQTT Handshake
To connect securely to the AWS IoT Core endpoint, we use the `WiFiClientSecure` library. It loads the Root CA certificate, the client certificate, and the private key, executing an SSL/TLS handshake on port 8883:

```cpp
WiFiClientSecure net = WiFiClientSecure();
PubSubClient client(net);

void connectAWS() {
  if (WiFi.status() != WL_CONNECTED) {
    return;
  }
  
  if (client.connected()) return;
  
  client.disconnect();
  net.stop();
  
  // Load certificates
  net.setCACert(AWS_CERT_CA);
  net.setCertificate(AWS_CERT_CRT);
  net.setPrivateKey(AWS_CERT_PRIVATE);
  
  client.setServer(AWS_IOT_ENDPOINT, 8883); // Secure MQTT Port

  Serial.print("Connecting to AWS IoT Core...");
  String clientId = "ESP32-HealthMonitor-" + String(WiFi.macAddress());
  
  if (client.connect(clientId.c_str())) {
    Serial.println(" Connected!");
  } else {
    Serial.print(" failed, rc=");
    Serial.println(client.state());
  }
}
```
The telemetry is packed into a JSON document and published to the AWS topic `health/esp32-user-1/raw` every 5 seconds, transmitting edge parameters (steps, activity) continuously.

## 5.2 Ingestion Lambda Function (IngestIoTData) Implementation

### 5.2.1 Data Validation and Raw Payload Decoding
The `IngestIoTData` Lambda function is written in Python 3.12. It processes batches of sensor telemetry routed from AWS IoT Core. The function parses incoming JSON, averages readings over the transmission window, and formats variables (floats, integers, booleans).

### 5.2.2 Mathematical Feature Extraction Code
To calculate Heart Rate Variability (HRV), the function computes the RMSSD metric. It also calculates the skewness and kurtosis of the vital signs sample buffer:

```python
def calculate_stats(values):
    """Calculate skewness and kurtosis manually to avoid scipy dependency"""
    n = len(values)
    if n < 3:
        # Default baselines from standard distributions
        return 0.70, -0.75
    
    mean = np.mean(values)
    std = np.std(values, ddof=1)
    if std < 1e-6:
        return 0.0, 0.0
        
    # Skewness: E[(X - mu)^3] / std^3
    skew = np.sum((values - mean)**3) / (n * (std**3))
    
    # Kurtosis: E[(X - mu)^4] / std^4 - 3 (excess kurtosis)
    kurt = np.sum((values - mean)**4) / (n * (std**4)) - 3
    
    return float(skew), float(kurt)
```

### 5.2.3 Custom Unpickler for Isolation Forest Model Deserialization
When machine learning models are trained in local Jupyter notebooks, they are pickled under the local scope (`__main__`). When unpickled in the AWS Lambda runtime namespace, Python throws a `ModuleNotFoundError` because it cannot locate the custom classes (such as `EnsembleDetector`). 

To resolve this, we implement a `CustomUnpickler` subclass that overrides `find_class` to redirect the unpickling namespace to the current module scope:

```python
# Define EnsembleDetector class so it can be resolved during unpickling
class EnsembleDetector:
    def __init__(self, models):
        self.models = models

    def predict(self, X):
        preds = np.stack([m.predict(X) for m in self.models], axis=1)
        anomaly_votes = np.sum(preds == -1, axis=1)
        final_preds = np.where(anomaly_votes >= 2, -1, 1) # Majority voting
        return final_preds

    def decision_function(self, X):
        if_scores = self.models[0].decision_function(X)
        svm_scores = self.models[1].score_samples(X)
        svm_scores_scaled = (svm_scores - svm_scores.mean()) / (svm_scores.std() + 1e-8) * 0.1
        return (if_scores + svm_scores_scaled) / 2.0

class CustomUnpickler(pickle.Unpickler):
    def find_class(self, module, name):
        if name == 'EnsembleDetector':
            return EnsembleDetector
        return super().find_class(module, name)

def load_models():
    global anomaly_model, anomaly_scaler
    if anomaly_model is None or anomaly_scaler is None:
        print("Loading anomaly detection models from disk...")
        with open(MODEL_PATH, 'rb') as f:
            anomaly_model = CustomUnpickler(f).load()
        with open(SCALER_PATH, 'rb') as f:
            anomaly_scaler = pickle.load(f)
```

## 5.3 Disease Prediction Lambda Function (PredictDisease) Implementation

### 5.3.1 Soft-Voting Ensemble Logic
The `PredictDisease` Lambda function handles supervised risk evaluation. It accepts 13 clinical features and passes them to a pre-trained soft-voting ensemble model.

### 5.3.2 Machine Learning Model Inference Python Code
The ensemble model calculates the heart disease probability and returns suggestions based on the risk category:

```python
def handler(event, context):

    if event.get('httpMethod') == 'OPTIONS':
        return {

            'headers': {

            "fbs", "restecg", "thalach", "exang",

## 5.4 App Telemetry Data Query Layer (FetchAppTelemetry)
The `FetchAppTelemetry` Lambda function is written in Node.js 22.x. It queries DynamoDB and returns a snapshot of the latest telemetry along with the most recent 20 samples:

```javascript

            Limit: 20

        const result = await dynamo.send(new QueryCommand(params));

The table structure is configured as follows:

    *   `isAnomaly`: Boolean — anomaly state.

### 5.6.2 State Management Orchestration (AppController)
The `AppController` extends `ChangeNotifier`. It acts as the central state orchestrator, updating components and notifying listeners:

class AppController extends ChangeNotifier {
  AppController({required this.telemetryRepository, ...});

  final TelemetryRepository telemetryRepository;
  HealthSnapshot? _snapshot;
  List<TelemetrySample> _samples = const [];
  
  HealthSnapshot? get snapshot => _snapshot;
  List<TelemetrySample> get samples => _samples;

  Future<void> refresh() async {
    _setLoading(true);
    try {
      final snapshot = await telemetryRepository.getLatestSnapshot();
      final samples = await telemetryRepository.getRecentSamples();
      _snapshot = snapshot;
      _samples = samples;
      _errorMessage = null;
    } catch (_) {
      _errorMessage = 'Could not refresh health data.';
    } finally {
      _setLoading(false);
      notifyListeners();
    }
  }
}

# Chapter 6: Results, Testing, and Evaluation

## 6.1 Hardware Prototype Calibration and Sensor Tuning
Before conducting system testing, the sensor modules connected to the classic ESP32 were calibrated to ensure high signal-to-noise ratios (SNR).

### Accelerometer Calibration
The MPU6050 MEMS accelerometer exhibits minor zero-g offsets due to PCB mounting stress. An offset calibration routine was executed with the device resting on a flat, horizontal surface. The raw acceleration offsets were measured and subtracted in the firmware:
*   **X-axis offset**: $-0.02g$
*   **Y-axis offset**: $+0.04g$
*   **Z-axis offset**: $-0.05g$
The dynamic step threshold $\theta_{\text{step}}$ was tuned experimentally to **$1.22g$** to prevent false triggers from minor hand movements while ensuring that standard footsteps (typically generating acceleration peaks between $1.25g$ and $1.55g$) are registered.

### PPG Sensor Tuning
The MAX30102 pulse amplitude registers were tuned to prevent photodetector saturation while maintaining an adequate optical signal. The LED currents were set to:
*   **Red LED Current**: $6.2\text{ mA}$ (register value `0x1F`)
*   **IR LED Current**: $6.2\text{ mA}$ (register value `0x1F`)
This balanced configuration provides clear AC pulse waves through the finger tissue and extends the battery life of the portable prototype.

---

## 6.3 Machine Learning Pipeline Evaluation Results

### 6.3.1 Unsupervised Isolation Forest Anomaly Detection Metrics
The Isolation Forest ensemble model deployed in the `IngestIoTData` Lambda function was evaluated against synthetic anomaly datasets containing injected biometric anomalies (e.g., severe bradycardia, tachycardia, and hypoxic drops).
*   **Contamination Rate**: $0.01$ (optimized to represent typical daily anomalies)
*   **Model Accuracy**: **99.00%**
*   **Recall (Sensitivity to anomalies)**: **100.00%**

### 6.3.2 Cardiac Risk Assessment Ensemble Classifier Performance

#### 6.3.2.1 Accuracy, Precision, Recall, and F1-Score
The supervised cardiac risk assessment ensemble combines Random Forest, Histogram-based Gradient Boosting, and SVM classifiers. It was trained and validated on the UCI Cleveland Heart Disease dataset (303 records, 13 clinical features) using a 70/30 train/test split.

#### Table 6.3: Heart Disease Prediction Model Performance Comparison

| **Ensemble (Soft-Voting)** | **86.89%** | **85.71%** | **85.71%** | **85.71%** | **0.9513** |

The soft-voting ensemble outperformed the base models, achieving an accuracy of **86.89%** and a recall (sensitivity) of **85.71%**. In clinical screening tools, high recall is vital to minimize false-negative predictions.

## 6.4 Database Ingestion Verification & Latency Statistics
To evaluate system response times, we measured the end-to-end communication latency of the IoT backend.

### Latency Profiles
*   **MQTT Telemetry Latency**: The average duration for a telemetry packet to travel from the ESP32 to AWS IoT Core over standard WiFi is **124 ms**.
*   **Lambda Processing Duration**:
    *   **Warm Start**: **74 ms** (average execution time for `IngestIoTData` Lambda when the container is warm).
    *   **Cold Start**: **1,150 ms** (initial execution time due to loading libraries like `numpy` and `pandas`).
*   **DynamoDB Write Latency**: The average database write operation takes **14 ms**.
*   **API Gateway Polling Latency**: The Flutter application retrieves data in **142 ms** via API Gateway, providing a responsive experience for the user.

## 6.5 Flutter Mobile Application UI Verification & Live Telemetry Rendering
The final integration test verified that the Flutter mobile application correctly rendered live telemetry instead of mock data.

During initial release builds (`flutter build apk --release`), the app would fail to query the API Gateway and fallback to the mock data dashboard (displaying standard values: `BPM: 96`, `SpO2: 92%`, `Steps: 3650`). 
*   **Diagnosis**: The release build lacked the `<uses-permission android:name="android.permission.INTERNET"/>` tag in the main manifest.
*   **Fix**: Adding the internet permission tag allowed the app to communicate with the AWS API Gateway.
*   **Verification Results**: The newly built application dynamically retrieves and displays live telemetry:
    *   *Finger Off Sensor*: Displays `BPM: 0`, `SpO2: 0%`, and the status banner *"Wearable active. Place finger on sensor for vitals."*
    *   *Step Detection*: Shaking the hardware increments the step counter in the mobile app.
    *   *Activity Recognition*: Movement changes the status card to `"Activity: Walking"` or `"Activity: Jogging"` in real-time.
    *   *Cardiac Risk Prediction*: Submitting the questionnaire calls the `PredictDisease` Lambda, updating the gauge and suggesting clinical actions.

# Chapter 7: Conclusions & Future Scope

## 7.1 Summary of Work Completed
This project has successfully designed, implemented, and validated an intelligent, secure, and serverless **Hybrid Edge-Cloud IoT Health Monitoring System**. The system integrates physical biomedical sensing, edge computing, serverless cloud processing, and mobile visualization:

1.  **Edge Perception & Computing (ESP32)**: We successfully interfaced a classic ESP32 microcontroller with a MAX30102 PPG sensor and an MPU6050 IMU over a shared $\text{I}^2\text{C}$ bus. C++ firmware was developed to calculate gravity-compensated acceleration magnitude, run a non-blocking rolling buffer, count steps using a dynamic thresholding peak-detection algorithm, and classify user activities (Resting, Walking, Jogging) using heuristics.
2.  **Local Dashboard & Network Ingestion**: The ESP32 hosts a local HTTP web server that serves an HTML/JS dashboard displaying real-time metrics to devices on the same network. It establishes a secure MQTT over TLS connection to AWS IoT Core to publish summaries every 5 seconds.
3.  **AWS Serverless Analytics Pipeline**: Telemetry is routed to Python and Node.js Lambda functions. The ingestion function extracts biometric features (RMSSD HRV) and applies an unsupervised Isolation Forest ensemble to detect anomalies. The supervised risk assessment Lambda applies a soft-voting ensemble (Random Forest, Histogram Gradient Boosting, and SVC) to predict cardiac risk. Database records are stored dynamically in Amazon DynamoDB and exposed via API Gateway.
4.  **Flutter Client Application**: We built a cross-platform mobile application utilizing a Clean Architecture layout and state management. The app polls the AWS API Gateway, rendering live sensor parameters, step counts, and cardiac predictions.

---

## 7.2 Summary of Key Contributions
This project introduces several key contributions to the design of healthcare monitoring systems:
*   **Edge-Cloud Workload Partitioning**: Rather than streaming high-frequency raw sensor streams, the ESP32 performs data aggregation, step counting, and activity classification locally. This reduces cloud ingestion payload volume by over 90%, lowering network transmission costs and radio duty cycles.
*   **Dual-Sensor Correlation & Reduced False Alarms**: By correlating physical movement (accelerometer) with cardiac vital signs, the system reduces false-positive clinical alerts. If a high heart rate is detected while the user is jogging, the anomaly detection model does not flag a false alarm.
*   **Serverless Ingestion Footprint Optimization**: The cloud backend utilizes AWS serverless layers. By using the AWS Pandas SDK layer and a custom unpickling utility in Python, we packaged our machine learning models within the AWS Lambda code size limits.

---

## 7.3 Limitations of Current System
Despite its contributions, the current prototype has several technical limitations:
1.  **Local Web Server Access**: The local dashboard hosted on the ESP32 is only accessible to devices connected to the same WiFi network. Accessing the dashboard from outside requires manual router port forwarding.
2.  **PPG Motion Artifacts**: Photoplethysmography is highly sensitive to motion. Shaking the hand while holding the MAX30102 sensor introduces noise, which can result in inaccurate heart rate and $\text{SpO}_2$ calculations.
3.  **Lack of Authentication on API Gateway**: The public API Gateway endpoints are open. Securing access requires implementing token-based authorization.
4.  **Power Constraints**: While edge computing reduces radio power consumption, continuous WiFi connection and web server execution on the ESP32 require a stable power supply, limiting battery-powered portability.

---

## 7.4 Future Recommendations & Extensions
To transition the system from a prototype to a clinical-grade medical platform, several extensions are proposed:

### 1. TinyML Integration
The current heuristic activity recognition model can be replaced with a deep learning classifier running on the edge. By using frameworks like **Edge Impulse**, a Convolutional Neural Network (CNN) can be trained on linear acceleration vectors and deployed directly on the ESP32, improving classification accuracy.

### 2. AWS Cognito User Authentication
To secure API access, we can integrate **AWS Cognito User Pools**. This allows patients and medical professionals to sign up and log in securely, generating JSON Web Tokens (JWT) to authorize requests at the API Gateway.

### 3. Dual Vital Sensor Interfacing
The system can be expanded to include an **AD8232 ECG sensor** alongside the MAX30102 PPG sensor. This dual configuration allows the ESP32 to measure Pulse Transit Time (PTT)—the time delay between the R-peak of the ECG and the corresponding peak in the PPG waveform—enabling non-invasive, continuous blood pressure monitoring.

```
       AD8232 ECG Waveform (Electrical Signal)
              |
              |       PPG Waveform (Optical Signal)
              |            |
              v            v
      +----------------------------+
      |  R-Peak        PPG Peak    |
      |    |              |        |
      |    +----> PTT <---+        |
      +----------------------------+
                    |
                    v
         Continuous Blood Pressure
```

### 4. Advanced Noise Filtering
Applying digital signal processing (DSP) filters—such as bandpass Butterworth filters—directly in the ESP32 firmware can help remove high-frequency motion artifacts from the raw PPG signal before feature extraction.
